services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deshi
      POSTGRES_PASSWORD: deshi
      POSTGRES_DB: deshi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deshi"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://deshi:deshi@db:5432/deshi
      JWT_SECRET: dev-secret
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      API_URL: http://localhost:4000

volumes:
  pgdata:
